name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (Apple Silicon)
            asset: ps4-pkg-installer-macos-arm64
          - os: windows-latest
            label: Windows
            asset: ps4-pkg-installer-windows-x64
          - os: ubuntu-latest
            label: Linux
            asset: ps4-pkg-installer-linux-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          # flet_desktop trae el runtime de Flutter (~45 MB). Sin él, PyInstaller
          # no falla pero produce un binario que muere al arrancar con
          # "ModuleNotFoundError: No module named 'flet_desktop'".
          python -c "import flet_desktop, os; print('flet_desktop OK:', os.path.dirname(flet_desktop.__file__))"

      - name: Fetch the 7-Zip CLI
        shell: bash
        env:
          # Las descargas salen del repo oficial en GitHub y no de 7-zip.org/a/:
          # ese directorio guarda una sola versión y devuelve 404 apenas sale la
          # siguiente, así que ataba cada release a que nadie publicara nada.
          SEVENZIP: "25.01"
        run: |
          set -euo pipefail
          mkdir -p vendor
          BASE="https://github.com/ip7z/7zip/releases/download/${SEVENZIP}"
          TAG="7z$(echo "$SEVENZIP" | tr -d .)"
          case "${{ runner.os }}" in
            macOS)
              curl -fsSL "$BASE/${TAG}-mac.tar.xz" -o 7z.tar.xz
              tar -xf 7z.tar.xz 7zz && mv 7zz vendor/7zz && chmod +x vendor/7zz
              ;;
            Linux)
              curl -fsSL "$BASE/${TAG}-linux-x64.tar.xz" -o 7z.tar.xz
              tar -xf 7z.tar.xz 7zz && mv 7zz vendor/7zz && chmod +x vendor/7zz
              ;;
            Windows)
              # El 7-Zip COMPLETO (7z.exe + su 7z.dll), no el 7za.exe del paquete
              # Extra: ese es la versión de formatos reducidos y no lee RAR, que
              # es como viene casi todo release de PS4. En mac y Linux el binario
              # `7zz` ya es el completo; esto pone a Windows a la par.
              # 7zr.exe es un extractor mínimo y autónomo, solo para abrir el
              # instalador de 7-Zip, que adentro trae el 7z.exe que queremos.
              curl -fsSL "$BASE/7zr.exe" -o 7zr.exe
              curl -fsSL "$BASE/${TAG}-x64.exe" -o 7zsetup.exe
              ./7zr.exe x 7zsetup.exe -ovendor -y 7z.exe 7z.dll
              ;;
          esac
          ls -l vendor/

      - name: Fetch a fallback RAR extractor
        shell: bash
        continue-on-error: true
        run: |
          # 7-Zip lee los headers de cualquier RAR5 pero no implementa todos
          # los codecs: con un RAR comprimido ("-m3") lista bien el contenido y
          # muere al extraer con "Unsupported Method". unar/unrar sí pueden.
          # Si este paso falla el build sigue: el ejecutable queda sin respaldo
          # y esos archivos dan un error explicativo en vez de romper todo.
          set -eu
          mkdir -p vendor
          case "${{ runner.os }}" in
            macOS)
              brew install unar
              cp "$(brew --prefix)/bin/unar" vendor/unar
              ;;
            Linux)
              sudo apt-get update -qq && sudo apt-get install -y unar
              cp "$(command -v unar)" vendor/unar
              ;;
            Windows)
              # RARLAB no publica un zip pelado del unrar de Windows: viene
              # dentro de un autoextraíble que es, justamente, un RAR con el
              # método que 7-Zip no sabe descomprimir (deja un .exe de 0 bytes).
              # Así que en vez de abrirlo, se lo corre: "-s" es sin ventanas y
              # "-d" elige a dónde deja los archivos.
              curl -fsSL https://www.rarlab.com/rar/unrarw64.exe -o unrarw64.exe
              ./unrarw64.exe -s -d"$(pwd -W)\\unrarbin"
              cp unrarbin/UnRAR.exe vendor/unrar.exe
              [ -s vendor/unrar.exe ]
              ;;
          esac
          ls -l vendor/

      - name: Build
        shell: bash
        run: |
          # El separador de --add-binary es ';' en Windows y ':' en el resto.
          EXTRA_LIB=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            SEP=";"; SEVENZIP="vendor/7z.exe"; FALLBACK="vendor/unrar.exe"
            ICONO="assets/icon.ico"
            # 7z.exe no hace nada sin su DLL al lado: --onefile las descomprime
            # juntas en la carpeta temporal donde archives.py las busca.
            EXTRA_LIB="--add-binary vendor/7z.dll${SEP}."
          else
            SEP=":"; SEVENZIP="vendor/7zz"; FALLBACK="vendor/unar"
            # macOS quiere .icns; Linux no usa icono embebido y lo ignora.
            ICONO="assets/icon.icns"
          fi
          # Los iconos van versionados a propósito: generarlos acá obligaría a
          # instalar Pillow en el runner. Se regeneran con tools/make_icon.py.
          if [ ! -f "$ICONO" ]; then
            echo "::error::Falta $ICONO — corré tools/make_icon.py y commiteá assets/"
            exit 1
          fi
          EXTRA=""
          # El respaldo es opcional: si su descarga falló, se compila sin él.
          if [ -f "$FALLBACK" ]; then
            EXTRA="--add-binary ${FALLBACK}${SEP}."
          else
            echo "::warning::Sin extractor de respaldo: los RAR comprimidos no se van a poder abrir."
          fi
          pyinstaller --noconfirm --onefile --windowed \
            --name "PS4 PKG Installer" \
            --icon "$ICONO" \
            --osx-bundle-identifier dev.konix.ps4-pkg-installer \
            --collect-all flet \
            --collect-all flet_desktop \
            --add-binary "${SEVENZIP}${SEP}." \
            $EXTRA_LIB \
            $EXTRA \
            ps4_pkg_installer.py

      - name: Verify the runtime got bundled
        shell: bash
        run: |
          # Un binario sano ronda los 50-70 MB. Si sale ~10 MB, el runtime de
          # Flutter quedó afuera y el ejecutable no arranca.
          BIN=$(find dist -maxdepth 3 -type f \( -name "PS4 PKG Installer" -o -name "PS4 PKG Installer.exe" \) | head -1)
          echo "binario: $BIN"
          SIZE=$(python -c "import os,sys; print(os.path.getsize(sys.argv[1]))" "$BIN")
          echo "tamaño: $((SIZE / 1024 / 1024)) MB"
          if [ "$SIZE" -lt 35000000 ]; then
            echo "::error::El binario pesa menos de 35 MB: el runtime de Flet no quedó embebido."
            exit 1
          fi

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -qry "../${{ matrix.asset }}.zip" "PS4 PKG Installer.app"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/PS4 PKG Installer.exe" -DestinationPath "${{ matrix.asset }}.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          tar czf "../${{ matrix.asset }}.tar.gz" "PS4 PKG Installer"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.zip
            ${{ matrix.asset }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          ls -lh assets
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --notes "Prebuilt binaries below need no Python installed.

          **macOS:** unzip and run. The build is unsigned, so on first launch use
          right-click → Open, or \`xattr -dr com.apple.quarantine \"PS4 PKG Installer.app\"\`.

          **Windows:** unzip and run the \`.exe\`.

          **Linux:** \`tar xzf\` and run the binary (\`chmod +x\` if needed).

          Prefer running from source? \`pip install -r requirements.txt && python3 ps4_pkg_installer.py\`" \
            assets/* \
          || gh release upload "$TAG" assets/* --clobber
